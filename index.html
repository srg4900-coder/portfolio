<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F4">
<meta name="description" content="Sadie Gold, brand designer. Selected work.">
<title>Sadie Gold | Brand Designer</title>

<!--
  FILE MAP
    css/tokens.css       colors, type, spacing, motion, z-index. Edit values HERE.
    css/components.css   base, type, nav, light-box background, cursor, paper, contact modal (shared)
    css/home.css         homepage: hero + sheets (scatter -> grid)
    js/projects-data.js  every project's title, cover, media (shared) + HOME_ORDER
    js/order.js          default order, or a company link's (?for=), see /admin/
    js/home.js           builds the sheets, scroll-driven scatter -> grid
    js/nav.js            the header links on every page (Work / About / Contact)
    js/cursor.js, touch.js, contact.js, viewer.js (shared)
-->

<script>
  // reload always starts at the top so the scatter -> grid sequence plays from the start;
  // arriving from a Work link (#work) skips straight to the settled grid (js/home.js)
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (location.hash !== '#work') window.scrollTo(0, 0);
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500&family=Cutive+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css?v=10">
<link rel="stylesheet" href="css/components.css?v=10">
<link rel="stylesheet" href="css/home.css?v=10">
</head>
<body class="home">

  <!-- light-box background image (assets/lightbox/), homepage only -->
  <div class="lightbox" aria-hidden="true"></div>

  <header class="site-nav site-nav--fade-in">
    <a class="logo-button" href="index.html">SG</a>
  </header>

  <main>
    <section class="hero" id="hero">
      <h1 class="hero__title text-title"><span>Sadie</span><span>Gold</span></h1>
      <p class="hero__role">Brand Designer</p>
    </section>

    <section class="sheets" id="work" aria-label="Selected work">
      <!-- one .sheet per project, in the portfolio order (js/order.js), built by js/home.js -->
    </section>

    <!-- the quiet way into Studio: under the prints, not in the nav -->
    <aside class="studio-nudge">
      <a class="studio-nudge__link text-label" href="studio.html" data-cursor-solid="white">
        <span>Off the clock: paintings, sketches, sewing</span><span aria-hidden="true">Studio &rarr;</span>
      </a>
    </aside>
  </main>

  <footer class="site-footer">
    <p class="text-label">&copy; Sadie Gold 2026</p>
    <nav class="site-footer__links" aria-label="More">
      <a class="text-label" href="studio.html">Studio</a>
      <a class="text-label" href="/mindcloud/">MindCloud</a>
    </nav>
  </footer>

  <!-- contents built by js/contact.js -->
  <div class="contact-modal"></div>

  <script src="js/nav.js?v=10"></script>
  <script src="js/cursor.js?v=10"></script>
  <script src="js/contact.js?v=10"></script>
  <script src="js/projects-data.js?v=10"></script>
  <script src="js/order.js?v=10"></script>
  <script src="js/home.js?v=10"></script>
  <script src="js/touch.js?v=10"></script>
</body>
</html>
