<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#100E0C">
<meta name="description" content="Sadie Gold — brand designer. Selected work.">
<title>Sadie Gold — Brand Designer</title>

<!--
  FILE MAP
    css/tokens.css       colors, type, spacing, motion, z-index. Edit values HERE.
    css/components.css   base, type, nav, light-box frame + glass, cursor, paper, contact modal (shared)
    css/home.css         homepage: hero + sheets (scatter -> grid)
    js/projects-data.js  every project's title, cover, media (shared) + HOME_ORDER
    js/home.js           builds the sheets, scroll-driven scatter -> grid
    js/cursor.js, touch.js, gestures.js, contact.js, paper.js (shared)
-->

<script>
  // reload always starts at the top so the scatter -> grid sequence plays from the start
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500&family=Cutive+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css?v=4">
<link rel="stylesheet" href="css/components.css?v=4">
<link rel="stylesheet" href="css/home.css?v=4">
</head>
<body class="home">

  <div class="lightbox" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="site-nav site-nav--fade-in">
    <div class="nav-left">
      <a class="logo-button" href="index.html" aria-label="Sadie Gold — home">SG</a>
    </div>
    <nav class="nav-right">
      <a href="/mindcloud/">MindCloud</a>
      <button data-open-contact>Contact</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <h1 class="hero__title text-title"><span>Sadie</span><span>Gold</span></h1>
      <p class="hero__role">Brand Designer</p>
    </section>

    <section class="sheets" id="sheets" aria-label="Selected work">
      <!-- one .sheet per HOME_ORDER entry, built by js/home.js -->
    </section>
  </main>

  <footer class="site-footer">
    <p class="text-label">&copy; Sadie Gold 2026</p>
  </footer>

  <!-- contents built by js/contact.js -->
  <div class="contact-modal"></div>

  <script src="js/gestures.js?v=4"></script>
  <script src="js/cursor.js?v=4"></script>
  <script src="js/contact.js?v=4"></script>
  <script src="js/projects-data.js?v=4"></script>
  <script src="js/home.js?v=4"></script>
  <script src="js/touch.js?v=4"></script>
</body>
</html>
