<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="About Sadie Gold, brand designer.">
<title>About | Sadie Gold</title>

<!--
  ABOUT. The bio, location line, email and resume path come from
  js/contact.js (window.SITE_COPY), so they stay identical to the contact
  popup: edit them there, not here.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500&family=Cutive+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css?v=29">
<link rel="stylesheet" href="css/components.css?v=29">
<link rel="stylesheet" href="css/pages.css?v=29">
</head>
<body class="page" data-page="about">

  <header class="site-nav">
    <a class="logo-button" href="index.html">SG</a>
  </header>

  <main class="page__main">
    <header class="page__head">
      <p class="page__eyebrow load-rise">About</p>
      <h1 class="text-title load-rise" style="--load-delay: 80ms;">Sadie Gold</h1>
      <p class="page__lede load-rise" style="--load-delay: 160ms;">Brand Designer</p>
    </header>

    <div class="about load-rise" style="--load-delay: 260ms;">
      <div class="about__bio text-project-body" data-about-bio></div>

      <dl class="about__facts">
        <div>
          <dt class="text-label">Education</dt>
          <dd>New Media Design BFA, graduating spring 2027</dd>
        </div>
        <div data-about-meta hidden>
          <dt class="text-label">Based</dt>
          <dd></dd>
        </div>
      </dl>

      <!-- the nudge into Studio: a quiet card, not a headline -->
      <a class="about__studio" href="studio.html" data-cursor-label="Studio">
        <img class="about__studio-img" src="assets/studio/paintings/master-work.jpg" alt="" loading="lazy">
        <span class="about__studio-text">
          <span class="about__studio-kicker">Off the clock</span>
          <span>Paintings, sketches and sewing live in the Studio &rarr;</span>
        </span>
      </a>

      <div class="about__links">
        <a class="cs-link" data-about-email href="#">Email</a>
        <a class="cs-link" data-about-resume href="#" target="_blank" rel="noopener">Resume</a>
        <button class="cs-link" type="button" data-open-contact data-cursor-solid="white">Contact</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p class="text-label">&copy; Sadie Gold 2026</p>
    <nav class="site-footer__links" aria-label="More">
      <a class="text-label" href="studio.html">Studio</a>
      <a class="text-label" href="/mindcloud/">MindCloud</a>
    </nav>
  </footer>

  <div class="contact-modal"></div>

  <script src="js/nav.js?v=29"></script>
  <script src="js/cursor.js?v=29"></script>
  <script src="js/contact.js?v=29"></script>
  <script src="js/touch.js?v=29"></script>
  <script>
    (function () {
      var copy = window.SITE_COPY;
      if (!copy) return;
      document.querySelector('[data-about-bio]').textContent = copy.bio.join(' ');
      // first META line is the location ("Based in NYC. Available Worldwide")
      var meta = document.querySelector('[data-about-meta]');
      if (copy.meta[0]) {
        meta.querySelector('dd').textContent = copy.meta[0].replace(/^Based in /, '');
        meta.hidden = false;
      }
      var email = document.querySelector('[data-about-email]');
      email.textContent = copy.email;
      email.href = 'mailto:' + copy.email;
      document.querySelector('[data-about-resume]').href = copy.resume;
    })();
  </script>
</body>
</html>
