<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDF9F5">
<meta name="description" content="About Sadie Gold, product &amp; brand designer.">
<title>About | Sadie Gold</title>

<!--
  ABOUT. The bio, location line, email and resume path come from
  js/contact.js (window.SITE_COPY), so they stay identical to the contact
  popup: edit them there, not here.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500&family=Cutive+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css?v=109">
<link rel="stylesheet" href="css/components.css?v=109">
<link rel="stylesheet" href="css/pages.css?v=109">
<!-- hold the page's entrance until its text is built and the font is in
     (released by the script at the end of the page; this timer is only a
     safety net), so it plays as one clean sequence with nothing jumping -->
<script>
  document.documentElement.classList.add('is-loading');
  setTimeout(function () { document.documentElement.classList.remove('is-loading'); }, 1500);
</script>
</head>
<body class="page" data-page="about">

  <header class="site-nav">
    <a class="logo-button" href="index.html">SG</a>
  </header>

  <main class="page__main page__main--about">
    <header class="page__head page__head--about">
      <!-- portrait: any size works, it crops to fill the 3:4 box. On phones
           it moves down beside the email / Resume row (css/pages.css) -->
      <div class="about__portrait chunk" style="--chunk: 1">
        <img src="assets/about/portrait.webp?v=2" alt="Sadie Gold" width="1200" height="1379" decoding="async">
      </div>
      <h1 class="text-title chunk" style="--chunk: 1">Sadie Gold</h1>
      <p class="page__lede chunk" style="--chunk: 2">Product &amp; <span style="white-space: nowrap">Brand Designer</span></p>
    </header>

    <!-- each .chunk arrives in turn (--chunk = its place in line, css/pages.css);
         the bio's sentences come in one by one (script below) -->
    <div class="about">
      <div class="about__bio text-project-body" data-about-bio></div>

      <dl class="about__facts">
        <div class="chunk" style="--chunk: 8">
          <dt class="text-label">Education</dt>
          <dd>BFA, New Media Design, RIT, 2027<br><span class="about__sub">Philosophy &amp; Psychology concentrations</span></dd>
        </div>
        <div class="chunk" style="--chunk: 9" data-about-meta hidden>
          <dt class="text-label">Based</dt>
          <dd></dd>
        </div>
        <!-- one row of app icons; the list lives in js/skills-data.js -->
        <div class="chunk" style="--chunk: 10">
          <dt class="text-label">Skills</dt>
          <dd data-skills></dd>
        </div>
      </dl>

      <div class="about__links chunk" style="--chunk: 11">
        <a class="cs-link" data-about-email href="#">Email</a>
        <span class="about__resume">
          <!-- phones only (css/pages.css): on a computer the resume comes
               with the bio's "grab my resume" link -->
          <a class="cs-link about__resume-link" data-about-resume href="#" download="Sadie-Gold-Resume.pdf">Resume</a>
          <!-- Instagram + LinkedIn icons added here by the script below -->
        </span>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p class="text-label">&copy; Sadie Gold 2026</p>
    <nav class="site-footer__links" aria-label="More">
      <button class="text-label" type="button" data-open-contact data-cursor-solid="white">Contact</button>
      <a class="text-label" href="studio.html">Studio</a>
      <a class="text-label" href="/mindcloud/">MindCloud</a>
    </nav>
  </footer>

  <div class="contact-modal"></div>

  <script src="js/nav.js?v=109"></script>
  <script src="js/cursor.js?v=109"></script>
  <script src="js/contact.js?v=109"></script>
  <script src="js/touch.js?v=109"></script>
  <script src="js/order.js?v=109"></script>
  <script src="js/skills-data.js?v=109"></script>
  <script src="js/skills.js?v=109"></script>
  <script>
    (function () {
      var copy = window.SITE_COPY;
      if (!copy) return;
      // the bio: four paragraphs, each arriving in turn (chunks 3 to 6).
      // Paragraph breaks differ by screen: each sentence says whether a
      // new paragraph starts before it on a computer (desk) and on a phone
      // (phone); css/pages.css shows only that screen's breaks. The last
      // paragraph ends in the call to action (a bold link).
      var BIO = [
        { t: 'I always start with how people feel.' },
        { t: 'I\u2019m a systems thinker, and every system I build starts with humans.', desk: true },
        { t: 'Emotions are physical and feelings are shared.', phone: true },
        { t: 'Whether it\u2019s an interface, a product, or a whole brand, I begin with research: where do users hesitate, lean in, or leave, and why?' },
        { t: 'I prototype until they feel without being told to.' },
        { t: 'I show my process because my thinking is half the work.', desk: true, phone: true },
        { t: 'Artistry, motion, and code are how I make things.' },
        { t: 'Philosophy and psychology are how I make sense of the people I make them for.' },
        { t: 'I\u2019m looking for an intense team that goes deep fast, sweats the details, and builds together.', desk: true, phone: true },
        { t: 'If that\u2019s yours,' }
      ];
      var bio = document.querySelector('[data-about-bio]');
      var group = 0;
      BIO.forEach(function (s, i) {
        if (i) {
          if (s.desk || s.phone) {
            var br = bio.appendChild(document.createElement('span'));
            br.className = 'about__break' + (s.desk ? ' is-desk' : '') + (s.phone ? ' is-phone' : '');
          }
          if (s.desk) group++;
          if (!(s.desk && s.phone)) bio.appendChild(document.createTextNode(' '));
        }
        var line = bio.appendChild(document.createElement('span'));
        line.className = 'chunk chunk--line';
        line.style.setProperty('--chunk', 3 + group);
        line.textContent = s.t;
        if (i === BIO.length - 1) {
          line.appendChild(document.createTextNode(' '));
          line.appendChild(resumeLink());
        }
      });

      // "grab my resume and let's talk ->": downloads the PDF and opens a
      // Gmail compose window (always Gmail, on phones too) in a new tab.
      // Phones skip the download (it gets lost there): they have the
      // Resume link in the row below instead.
      var phone = window.matchMedia('(max-width: 760px)');
      function resumeLink() {
        var a = document.createElement('a');
        a.className = 'about__cta';
        a.href = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(copy.email) +
          '&su=' + encodeURIComponent('Hi Sadie');
        a.target = '_blank';
        a.rel = 'noopener';
        a.setAttribute('aria-label', 'Download my resume and email me in Gmail');
        a.appendChild(document.createTextNode('grab my resume and let\u2019s talk'));
        var arrow = a.appendChild(document.createElement('span'));
        arrow.className = 'about__cta-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '\u2192';
        a.addEventListener('click', function () {
          if (phone.matches) return;
          var dl = document.createElement('a');
          dl.href = copy.resume;
          dl.setAttribute('download', 'Sadie-Gold-Resume.pdf');
          document.body.appendChild(dl);
          dl.click();
          dl.remove();
        });
        return a;
      }

      // the location: each array entry is its own line
      var meta = document.querySelector('[data-about-meta]');
      if (copy.location) {
        var dd = meta.querySelector('dd');
        [].concat(copy.location).forEach(function (line, k) {
          if (k) dd.appendChild(document.createElement('br'));
          dd.appendChild(document.createTextNode(line.replace(/^Based in /, '')));
        });
        meta.hidden = false;
      }
      var email = document.querySelector('[data-about-email]');
      email.textContent = copy.email;
      copy.mailLink(email, 'Hi Sadie');
      document.querySelector('[data-about-resume]').href = copy.resume;
      // Instagram + LinkedIn, right of the email (same icons as the Contact popup)
      var group = document.querySelector('.about__resume');
      if (copy.social) ['instagram', 'linkedin'].forEach(function (name) {
        var icon = copy.social(name);
        icon.classList.add('about__social');
        group.appendChild(icon);
      });

      // everything's built: once the font is in (or after 700ms at most,
      // so a slow connection never stalls the page), let the entrance play
      var fontsIn = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.race([fontsIn, new Promise(function (r) { setTimeout(r, 700); })]).then(function () {
        requestAnimationFrame(function () { document.documentElement.classList.remove('is-loading'); });
      });
    })();
  </script>
</body>
</html>
