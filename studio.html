<!-- hold the page's entrance until the font and the first pieces are in
     (released by js/studio.js; this timer is only a safety net), so it
     plays as one clean sequence with nothing popping in late -->
<script>
  document.documentElement.classList.add('is-loading');
  setTimeout(function () { document.documentElement.classList.remove('is-loading'); }, 1800);
</script>

    <!-- laid out like a project page's top: name, type in mono, tagline -->
    <header class="page__head page__head--studio">
      <h1>
        <span class="page__name text-title chunk" style="--chunk: 0">Studio</span>
        <span class="page__kind chunk" style="--chunk: 1">Select Works</span>

  </main>

    <nav class="site-footer__links" aria-label="More">
